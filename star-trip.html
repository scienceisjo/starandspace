<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>별 여행 · 우주 항해 시뮬레이터</title>
<style>
:root{--ink:#eaf2ff;--dim:#9fb3d9;--mute:#6a7ea8;--cy:#7ef3ff;--gold:#ffd166;--pink:#ff8fb1;--glass:rgba(10,18,40,.55);--edge:rgba(126,243,255,.28)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{z-index:0}#fx{z-index:1;pointer-events:none}
.hud{position:fixed;z-index:3;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,0 10px 40px rgba(0,0,0,.45)}
#nav{left:18px;top:16px;padding:12px 16px;min-width:250px}
#nav .t{font-size:12px;letter-spacing:.22em;color:var(--cy);font-weight:800;margin-bottom:8px}
#nav .r{display:flex;justify-content:space-between;gap:18px;font-size:14px;color:var(--dim);line-height:1.9}
#nav .r b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;font-weight:700}
#nav .r b.g{color:var(--gold)}
#msg{left:50%;top:16px;transform:translateX(-50%);max-width:min(760px,calc(100vw - 600px));text-align:center;padding:12px 22px}
#msg h2{font-size:clamp(17px,2vw,25px);letter-spacing:-.02em;line-height:1.35}
#msg p{font-size:clamp(13px,1.3vw,16px);color:var(--dim);margin-top:4px;line-height:1.45}
#map{right:18px;top:16px;width:250px;height:250px;padding:0;overflow:hidden}
#mapc{position:absolute;inset:0;width:100%;height:100%}
#map .t{position:absolute;left:12px;top:9px;font-size:11px;letter-spacing:.18em;color:var(--cy);font-weight:800}
#scopes{left:18px;bottom:96px;display:flex;gap:12px}
.scope{width:150px;padding:8px 8px 10px;text-align:center}
.scope canvas{position:static;width:134px;height:134px;border-radius:50%;background:#000;box-shadow:0 0 0 1px var(--edge),0 0 22px rgba(126,243,255,.12) inset}
.scope b{display:block;font-size:14px;margin-top:6px}
.scope small{display:block;font-size:11px;color:var(--mute)}
#ctl{left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:12px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 24px;font-size:clamp(15px,1.5vw,18px);font-weight:800;color:#03121a;background:linear-gradient(180deg,#9ff7ff,#4fd8ea);box-shadow:0 0 24px rgba(126,243,255,.35);touch-action:manipulation;letter-spacing:-.01em}
button.gold{background:linear-gradient(180deg,#ffe39a,#ffbe3d);box-shadow:0 0 24px rgba(255,209,102,.35)}
button.warp{background:linear-gradient(90deg,#c4a7ff,#ff8fb1);color:#1a0624;box-shadow:0 0 30px rgba(255,143,177,.45)}
button.ghost{background:rgba(10,18,40,.7);color:var(--ink);border:1px solid var(--edge);box-shadow:none}
button[hidden]{display:none}
#fly{min-width:250px}
#fly.on{filter:brightness(1.15);transform:scale(.97)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#hint{right:18px;bottom:24px;font-size:12px;color:var(--mute);text-align:right;line-height:1.6}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(220,235,255,.0),rgba(180,210,255,0) 60%);opacity:0;transition:opacity .4s}
#q{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,4,14,.72);backdrop-filter:blur(6px)}
#q.show{display:flex}
.qcard{width:min(760px,100%);max-height:94vh;overflow:auto;padding:26px 28px}
.qcard h2{font-size:24px;margin-bottom:4px}
.qcard>p{color:var(--dim);margin-bottom:16px}
.cmp{display:grid;grid-template-columns:44px 1fr auto;gap:8px 12px;align-items:center;margin-bottom:10px;font-size:15px}
.cmp i{display:block;height:14px;border-radius:7px}
label{display:block;font-weight:700;margin:14px 0 6px}
textarea{width:100%;min-height:68px;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(4,10,28,.85);color:var(--ink);resize:vertical;user-select:text}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips button{font-size:14px;padding:7px 12px;border-radius:999px;background:rgba(126,243,255,.12);color:var(--ink);border:1px solid var(--edge);box-shadow:none;font-weight:600}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:11;padding:10px 18px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#app-credit{position:fixed;z-index:3;left:0;right:0;bottom:4px;text-align:center;font-size:10px;color:rgba(160,180,220,.45);pointer-events:none}
@media(max-width:1100px){#msg{max-width:calc(100vw - 40px);top:auto;bottom:150px}#map{width:180px;height:180px}#scopes{bottom:auto;top:200px}.scope{width:116px}.scope canvas{width:100px;height:100px}#hint{display:none}}
@media(max-width:620px){#nav{min-width:0;padding:8px 12px}#nav .r{font-size:12px}#nav .r b{font-size:14px}#map{width:130px;height:130px}#scopes{top:auto;bottom:150px;left:auto;right:12px;flex-direction:column}#msg{bottom:96px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="nav" class="hud glass">
  <div class="t">STAR NAVIGATION</div>
  <div class="r"><span>목적지</span><b id="sDest" class="g">-</b></div>
  <div class="r"><span>태양계에서</span><b><span id="sDist">0</span> 광년</b></div>
  <div class="r"><span>남은 거리</span><b><span id="sLeft">-</span></b></div>
  <div class="r"><span>속도</span><b id="sSpd">정지</b></div>
  <div class="r"><span>비행 시간</span><b><span id="sTime">0</span> 초</b></div>
</div>
<div id="msg" class="hud glass"><h2 id="mh"></h2><p id="mp"></p></div>
<div id="map" class="hud glass"><canvas id="mapc"></canvas><div class="t">위에서 본 항로</div></div>
<div id="scopes" class="hud">
  <div class="scope glass"><canvas id="scV" width="268" height="268"></canvas><b>베가</b><small>지금 여기서 보이는 모습</small></div>
  <div class="scope glass"><canvas id="scR" width="268" height="268"></canvas><b>리겔</b><small>지금 여기서 보이는 모습</small></div>
</div>
<div id="ctl" class="hud">
  <button id="go" class="gold">🚀 베가로 출발</button>
  <button id="fly" hidden>▶ 날아가기 (누르고 있기)</button>
  <button id="warp" class="warp" hidden>⚡ 워프 40배</button>
  <button id="next" class="ghost" hidden></button>
</div>
<div id="hint" class="hud">끌어서 둘러보기 · 두 번 클릭 = 목적지 보기<br>스페이스 / → 누르고 있기 = 날아가기</div>
<div id="app-credit">© 2026 조승재(과학이조선생) · 해누리중학교 · All rights reserved · 최종 업데이트: 2026-11-02</div>

<div id="q"><div class="qcard glass">
  <h2>항해 일지</h2>
  <p>태양계에서는 두 별이 거의 똑같이 밝아 보였어요.</p>
  <div class="cmp"><span>베가</span><i id="cmpV" style="background:#cfe2ff"></i><span>25광년 · 약 25초</span></div>
  <div class="cmp"><span>리겔</span><i id="cmpR" style="background:#a9c4ff"></i><span>약 860광년</span></div>
  <label for="odd">① 항해하면서 이상하다고 느낀 점</label>
  <textarea id="odd" placeholder="예) 리겔은 훨씬 먼데도 지구에서는 베가와 비슷하게 보였다."></textarea>
  <label for="ques">② 그래서 궁금해진 것 (질문으로)</label>
  <textarea id="ques" placeholder="질문으로 써 보세요."></textarea>
  <div class="chips">
    <button type="button" data-s="왜 ">왜 ~?</button><button type="button" data-s="얼마나 ">얼마나 ~?</button>
    <button type="button" data-s="만약 ">만약 ~라면?</button><button type="button" data-s="어떻게 하면 ">어떻게 하면 ~?</button>
  </div>
  <div class="row"><button type="button" class="ghost" id="again">다시 항해하기</button><button type="button" class="gold" id="send">복사하고 질문나무 열기</button></div>
</div></div>
<div id="toast" class="glass"></div>

<script src="lib/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const D2R=Math.PI/180, still=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── 실제 별 자료: [이름, 적경°, 적위°, 거리(광년), 겉보기 등급, B−V 색지수] ──
// 거리는 측정값의 대표값(먼 별일수록 오차가 큼). 밝기는 「보이는 밝기 ∝ 별 자체의 밝기 ÷ 거리²」로 다시 계산한다.
const CAT=[
['베가',279.23,38.78,25.0,0.03,0.00],['리겔',78.63,-8.20,860,0.13,-0.03],
['시리우스',101.29,-16.72,8.6,-1.46,0.00],['카노푸스',95.99,-52.70,310,-0.74,0.15],['아크투르스',213.92,19.18,36.7,-0.05,1.23],
['알파 센타우리',219.90,-60.83,4.37,-0.27,0.71],['카펠라',79.17,45.99,42.9,0.08,0.80],['프로키온',114.83,5.22,11.5,0.34,0.42],
['아케르나르',24.43,-57.24,139,0.46,-0.16],['베텔게우스',88.79,7.41,548,0.50,1.85],['하다르',210.96,-60.37,390,0.61,-0.23],
['알타이르',297.70,8.87,16.7,0.77,0.22],['알데바란',68.98,16.51,65,0.87,1.54],['안타레스',247.35,-26.43,550,0.96,1.83],
['스피카',201.30,-11.16,250,0.97,-0.23],['폴룩스',116.33,28.03,33.8,1.14,1.00],['포말하우트',344.41,-29.62,25.1,1.16,0.09],
['데네브',310.36,45.28,2600,1.25,0.09],['레굴루스',152.09,11.97,79,1.35,-0.11],['카스토르',113.65,31.89,51,1.58,0.03],
['벨라트릭스',81.28,6.35,250,1.64,-0.22],['알닐람',84.05,-1.20,2000,1.69,-0.18],['알니탁',85.19,-1.94,1260,1.77,-0.21],
['민타카',83.00,-0.30,1200,2.23,-0.22],['사이프',86.94,-9.67,650,2.06,-0.17],['북극성',37.95,89.26,433,1.98,0.60],
['데네볼라',177.26,14.57,36,2.13,0.09],['셰리아크',282.52,33.36,960,3.45,0.00],['술라파트',284.74,32.69,620,3.24,-0.05],
['미라크',17.43,35.62,197,2.07,1.58],['알페라츠',2.10,29.09,97,2.06,-0.11],['두베',165.93,61.75,123,1.79,1.07],
['알카이드',206.89,49.31,104,1.86,-0.10],['알리오트',193.51,55.96,83,1.77,-0.02],['미르파크',51.08,49.86,510,1.79,0.48],
['엘나트',81.57,28.61,134,1.65,-0.13],['알헤나',99.43,16.40,109,1.93,0.00],['샤울라',263.40,-37.10,570,1.62,-0.22],
['라스알헤그',263.73,12.56,48.6,2.08,0.15],['코르 카롤리',194.01,38.32,115,2.89,-0.12]
];
// 우주 좌표(광년): 적도 좌표 → three.js(y 위)
function eq2v(ra,dec,r){const a=ra*D2R,d=dec*D2R;return new THREE.Vector3(r*Math.cos(d)*Math.cos(a),r*Math.sin(d),-r*Math.cos(d)*Math.sin(a));}
function bv2rgb(bv){ // B−V → 대략의 별빛 색
  const t=Math.max(-.4,Math.min(2,bv));let r,g,b;
  if(t<0){r=.62+.38*(t+.4)/.4;g=.74+.2*(t+.4)/.4;b=1}
  else if(t<.4){r=1;g=.94+.03*(.4-t)/.4;b=1-.25*t/.4}
  else if(t<1.2){r=1;g=.94-.22*(t-.4)/.8;b=.75-.33*(t-.4)/.8}
  else{r=1;g=.72-.2*(t-1.2)/.8;b=.42-.18*(t-1.2)/.8}
  return[r,g,b];}
const STARS=CAT.map(([n,ra,dec,d,m,bv])=>({name:n,pos:eq2v(ra,dec,d),d0:d,m0:m,rgb:bv2rgb(bv)}));
const VEGA=STARS[0],RIGEL=STARS[1];
const magAt=(s,p)=>s.m0+5*Math.log10(Math.max(s.pos.distanceTo(p),1e-4)/s.d0);  // 그 자리에서의 겉보기 밝기(등급)

// ── three.js 배경: 먼 별 + 은하수(무한히 멀어 시차 없음 → 카메라를 따라감) ──
const gl=$('gl');
const renderer=new THREE.WebGLRenderer({canvas:gl,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,1,0.01,2e6);
const sky=new THREE.Group();scene.add(sky);
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};}
const R=rng(20261102);
const vsh=`attribute float size;attribute vec3 col;varying vec3 vC;uniform float px;void main(){vC=col;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*px;gl_Position=projectionMatrix*mv;}`;
const fsh=`varying vec3 vC;uniform float soft;void main(){vec2 c=gl_PointCoord-.5;float r=length(c)*2.;float a=exp(-r*r*soft);if(a<.01)discard;gl_FragColor=vec4(vC*a,a);}`;
function pointsLayer(n,gen,soft){const P=new Float32Array(n*3),C=new Float32Array(n*3),S=new Float32Array(n);
  for(let i=0;i<n;i++){const o=gen(i);P.set(o.p,i*3);C.set(o.c,i*3);S[i]=o.s;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('col',new THREE.BufferAttribute(C,3));g.setAttribute('size',new THREE.BufferAttribute(S,1));
  const m=new THREE.ShaderMaterial({vertexShader:vsh,fragmentShader:fsh,uniforms:{px:{value:1},soft:{value:soft}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(g,m);sky.add(pts);return m;}
const FAR=9e5;
function randDir(){const u=R()*2-1,t=R()*Math.PI*2,s=Math.sqrt(1-u*u);return[s*Math.cos(t),u,s*Math.sin(t)];}
// 은하면 기준(은하 북극 RA 192.86 Dec 27.13, 은하 중심 RA 266.40 Dec −28.94)
const GN=eq2v(192.86,27.13,1),GC=eq2v(266.40,-28.94,1);let GY=new THREE.Vector3().crossVectors(GN,GC);
if(GY.dot(eq2v(318,48,1))<0)GY.negate(); // l=90° 가 백조자리 쪽이 되게
function gal(l,b){const cb=Math.cos(b);return new THREE.Vector3().addScaledVector(GC,cb*Math.cos(l)).addScaledVector(GY,cb*Math.sin(l)).addScaledVector(GN,Math.sin(b));}
function gauss(){return Math.sqrt(-2*Math.log(R()+1e-9))*Math.cos(2*Math.PI*R());}
const mats=[];
// 은하수 바탕: 하늘 전체 구에 셰이더로 그린다(은하 위도로 띠, 중심 쪽 밝게, 얼룩·먼지띠는 잡음으로)
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,transparent:true,blending:THREE.AdditiveBlending,
  uniforms:{GN:{value:GN},GC:{value:GC},GY:{value:GY}},
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vD;uniform vec3 GN,GC,GY;
  float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
  float n(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
    return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
  float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
  void main(){vec3 d=normalize(vD);float b=asin(clamp(dot(d,GN),-1.,1.));float l=atan(dot(d,GY),dot(d,GC));
    float core=pow(max(0.,cos(l*.5)),4.);                 // 은하 중심 쪽(궁수자리)일수록 밝고 두껍게
    float w=.07+.09*core;float band=exp(-b*b/(w*w));
    float m=fbm(d*7.)*.65+fbm(d*23.)*.35;                  // 별 구름 얼룩
    float dust=smoothstep(.45,.75,fbm(d*11.+3.))*exp(-b*b/(w*w*.18))*(.55+.45*core); // 가운데 먼지띠
    float I=band*(.35+.9*m)*(.55+1.3*core);I*=1.-.85*dust;
    vec3 warm=vec3(1.,.86,.68),cool=vec3(.72,.8,1.);vec3 c=mix(cool,warm,.35+.65*core);
    float halo=exp(-b*b/.18)*.12*(.4+core);               // 넓고 흐린 빛
    gl_FragColor=vec4(c*(I*.22+halo*.06),1.);}`});
// 한 번만 큐브맵으로 구워 배경으로 쓴다(매 프레임 계산하지 않음 → 크롬북에서도 가볍게)
{const bake=new THREE.Scene();bake.add(new THREE.Mesh(new THREE.SphereGeometry(10,96,64),skyMat));skyMat.blending=THREE.NormalBlending;skyMat.transparent=false;
 const rt=new THREE.WebGLCubeRenderTarget(1024,{generateMipmaps:true,minFilter:THREE.LinearMipmapLinearFilter});const cc=new THREE.CubeCamera(1,100,rt);
 bake.add(cc);cc.update(renderer,bake);scene.background=rt.texture;}
// 먼 별: 흐린 별이 훨씬 많게(밝기 분포), 은하수 쪽에 더 몰리게
mats.push(pointsLayer(14000,()=>{let d;if(R()<.35){const l=R()*Math.PI*2,b=gauss()*0.12;const v=gal(l,b);d=[v.x,v.y,v.z];}else d=randDir();
  const m=Math.pow(R(),3.2);const tint=R();const c=tint<.12?[1,.78,.6]:tint<.3?[.72,.83,1]:[.96,.96,1];const k=.18+m*.82;
  return{p:d.map(x=>x*FAR),c:c.map(x=>x*k),s:1.0+m*2.6};},3.4));
// 은하수의 촘촘한 작은 별(거친 결)
mats.push(pointsLayer(16000,()=>{let l=R()*Math.PI*2;if(R()<.5)l=gauss()*1.0;const core=Math.max(0,Math.cos(l/2))**4;const b=gauss()*(0.05+0.06*core);const v=gal(l,b);const k=.12+.3*R()*(.6+core);
  return{p:[v.x*FAR,v.y*FAR,v.z*FAR],c:[k,k*.97,k*.93],s:.8+R()*1.3};},3.6));

// ── 상태 ──
const ship=new THREE.Vector3(0,0,0);
let phase='home',target=null,holding=false,warp=false,vel=0,time=0,legTime=0,yaw=0,pitch=0,trail=[];
const SPEED=1,WARP=40,ARRIVE=0.5;
const fx=$('fx'),c2=fx.getContext('2d');let W=0,H=0,DPR=1;
function fit(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();
  fx.width=W*DPR;fx.height=H*DPR;c2.setTransform(DPR,0,0,DPR,0,0);mats.forEach(m=>m.uniforms.px.value=renderer.getPixelRatio()*Math.min(1.25,Math.max(.75,H/900)));
  const mc=$('mapc'),r=mc.getBoundingClientRect();mc.width=r.width*DPR;mc.height=r.height*DPR;}
addEventListener('resize',fit);

// ── 둘러보기 ──
let drag=null;
gl.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};gl.setPointerCapture(e.pointerId);});
gl.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw-(e.clientX-drag.x)*0.004;pitch=Math.max(-1.4,Math.min(1.4,drag.pitch+(e.clientY-drag.y)*0.004));});
gl.addEventListener('pointerup',()=>drag=null);gl.addEventListener('pointercancel',()=>drag=null);
gl.addEventListener('dblclick',()=>{yaw=0;pitch=0;});
let lookAt=VEGA.pos.clone().normalize();
function aim(){ // 목적지(또는 시작 화면의 두 별 사이)를 기준으로 끌어서 돌린 방향
  const base=(target?target.pos.clone().sub(ship):lookAt.clone()).normalize();
  const up=new THREE.Vector3(0,1,0);const right=new THREE.Vector3().crossVectors(base,up).normalize();const realUp=new THREE.Vector3().crossVectors(right,base);
  const d=base.clone().applyAxisAngle(realUp,yaw);const r2=new THREE.Vector3().crossVectors(d,realUp).normalize();d.applyAxisAngle(r2,pitch);
  cam.position.copy(ship);cam.up.copy(realUp);cam.lookAt(ship.clone().add(d));sky.position.copy(ship);}

// ── 별빛 그리기(2D 위에 가산 합성) ──
function glowSprite(rgb){const s=256,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');const h=s/2;
  const gr=g.createRadialGradient(h,h,0,h,h,h);const [r,gg,b]=rgb.map(v=>Math.round(v*255));
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.06,`rgba(${r},${gg},${b},.95)`);gr.addColorStop(.22,`rgba(${r},${gg},${b},.28)`);gr.addColorStop(.5,`rgba(${r},${gg},${b},.07)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);return c;}
STARS.forEach(s=>s.spr=glowSprite(s.rgb));
const tmp=new THREE.Vector3();
function project(p){tmp.copy(p).project(cam);if(tmp.z>1)return null;return{x:(tmp.x+1)/2*W,y:(1-tmp.y)/2*H};}
// 등급 → 화면 크기(눈이 느끼는 밝기는 로그에 가깝다)
function look(m){const f=Math.pow(10,-0.4*(m-1));return{core:Math.min(3.2+2.4*Math.pow(f,.28),40),halo:Math.min(10+16*Math.pow(f,.36),Math.max(W,H)*1.1),a:Math.max(.12,Math.min(1,.35+.65*Math.pow(f,.2)))};}
function drawStar(ctx,s,x,y,m,scale){const L=look(m),k=scale||1;
  ctx.globalAlpha=L.a;const hs=L.halo*k*2;ctx.drawImage(s.spr,x-hs/2,y-hs/2,hs,hs);
  if(m<1.2){ // 밝은 별: 망원경 회절 무늬 같은 십자 빛살
    const len=L.halo*k*(m<-3?1.6:1.1),a=Math.min(.9,.25+(1.2-m)*.06);ctx.globalAlpha=a;const [r,g,b]=s.rgb.map(v=>Math.round(v*255));
    for(const [dx,dy] of [[1,0],[0,1]]){const gr=ctx.createLinearGradient(x-dx*len,y-dy*len,x+dx*len,y+dy*len);
      gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,`rgba(${r},${g},${b},1)`);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.strokeStyle=gr;ctx.lineWidth=Math.max(1,L.core*.22*k);
      ctx.beginPath();ctx.moveTo(x-dx*len,y-dy*len);ctx.lineTo(x+dx*len,y+dy*len);ctx.stroke();}}
  ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,L.core*.5*k,0,6.283);ctx.fill();}

// 워프 빛줄기
const streaks=[];for(let i=0;i<260;i++)streaks.push({a:R()*6.283,r:R(),v:.4+R()*1.2,h:R()});
function drawWarp(dt,amt){if(amt<=0.01)return;const cx=W/2,cy=H/2,M=Math.hypot(W,H)/2;c2.globalCompositeOperation='lighter';
  for(const s of streaks){if(!still)s.r+=dt*s.v*amt*1.8;if(s.r>1){s.r=.02+R()*.1;s.a=R()*6.283;}
    const r1=s.r*s.r*M,r0=Math.max(0,r1-M*0.18*amt*s.r);const x0=cx+Math.cos(s.a)*r0,y0=cy+Math.sin(s.a)*r0,x1=cx+Math.cos(s.a)*r1,y1=cy+Math.sin(s.a)*r1;
    const g=c2.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,s.h<.5?`rgba(170,210,255,${.7*amt})`:`rgba(230,190,255,${.6*amt})`);
    c2.strokeStyle=g;c2.lineWidth=1+s.r*2.2;c2.beginPath();c2.moveTo(x0,y0);c2.lineTo(x1,y1);c2.stroke();}
  c2.globalCompositeOperation='source-over';}

// 목적지 표시(조준선)와 화면 밖 화살표
function reticle(s,label,color){const p=project(s.pos);const cx=W/2,cy=H/2;
  if(p&&p.x>-40&&p.x<W+40&&p.y>-40&&p.y<H+40){const r=26;c2.strokeStyle=color;c2.lineWidth=2;c2.globalAlpha=.9;
    for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){c2.beginPath();c2.moveTo(p.x+sx*r,p.y+sy*(r-10));c2.lineTo(p.x+sx*r,p.y+sy*r);c2.lineTo(p.x+sx*(r-10),p.y+sy*r);c2.stroke();}
    c2.font='700 15px Pretendard,Malgun Gothic,sans-serif';c2.fillStyle=color;c2.textAlign='left';c2.fillText(label,p.x+r+8,p.y-r+6);c2.globalAlpha=1;return;}
  tmp.copy(s.pos).project(cam);let dx=tmp.x,dy=-tmp.y;if(tmp.z>1){dx=-dx;dy=-dy;}const a=Math.atan2(dy,dx);const ex=cx+Math.cos(a)*(Math.min(W,H)/2-60),ey=cy+Math.sin(a)*(Math.min(W,H)/2-60);
  c2.save();c2.translate(ex,ey);c2.rotate(a);c2.fillStyle=color;c2.globalAlpha=.85;c2.beginPath();c2.moveTo(14,0);c2.lineTo(-8,-9);c2.lineTo(-8,9);c2.fill();c2.restore();
  c2.font='700 14px Pretendard,Malgun Gothic,sans-serif';c2.fillStyle=color;c2.textAlign='center';c2.fillText(label,ex-Math.cos(a)*30,ey-Math.sin(a)*30+5);c2.globalAlpha=1;}

// 망원경 창(두 별을 같은 기준으로 비교)
function scope(id,s){const cv=$(id),x=cv.getContext('2d'),w=cv.width;x.clearRect(0,0,w,w);x.save();x.beginPath();x.arc(w/2,w/2,w/2,0,6.283);x.clip();
  x.fillStyle='#000';x.fillRect(0,0,w,w);x.globalCompositeOperation='lighter';
  const m=magAt(s,ship),L=look(m);const sc=Math.min(1,(w*0.9)/(L.halo*2));drawStarCtx(x,s,w/2,w/2,m,sc*1.6);x.restore();
  x.strokeStyle='rgba(126,243,255,.25)';x.lineWidth=2;x.beginPath();x.moveTo(w/2,8);x.lineTo(w/2,26);x.moveTo(w/2,w-8);x.lineTo(w/2,w-26);x.moveTo(8,w/2);x.lineTo(26,w/2);x.moveTo(w-8,w/2);x.lineTo(w-26,w/2);x.stroke();}
function drawStarCtx(ctx,s,x,y,m,k){drawStar(ctx,s,x,y,m,k);}

// 위에서 본 항로(적도면에 투영, 실제 방향)
function drawMap(){const mc=$('mapc'),x=mc.getContext('2d'),w=mc.width,h=mc.height;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,w,h);
  const far=Math.max(ship.length(),target?target.pos.length():25);let span=(phase==='home'||target===VEGA)?32:Math.max(40,far*1.15);
  if(phase==='rigelArr'||phase==='log')span=RIGEL.pos.length()*1.15;
  const s=(Math.min(w,h)/2-18*DPR)/span,cx=w/2,cy=h/2+6*DPR;const P=v=>[cx+v.x*s,cy+v.z*s];
  x.strokeStyle='rgba(126,243,255,.12)';x.lineWidth=1;for(let r=1;r<=3;r++){x.beginPath();x.arc(cx,cy,r*(Math.min(w,h)/2-18*DPR)/3,0,6.283);x.stroke();}
  x.font=`600 ${11*DPR}px Pretendard,Malgun Gothic,sans-serif`;x.textAlign='center';
  for(const st of STARS){if(st.pos.length()>span*1.05)continue;const [a,b]=P(st.pos);x.fillStyle=st===VEGA?'#cfe2ff':st===RIGEL?'#a9c4ff':'rgba(200,215,255,.35)';
    x.beginPath();x.arc(a,b,(st===VEGA||st===RIGEL?3.4:1.6)*DPR,0,6.283);x.fill();if(st===VEGA||st===RIGEL){x.fillStyle='#eaf2ff';x.fillText(st.name,a,b-7*DPR);}}
  const [sx,sy]=P(new THREE.Vector3());x.fillStyle='#ffd166';x.beginPath();x.arc(sx,sy,3.6*DPR,0,6.283);x.fill();x.fillStyle='#ffd166';x.fillText('태양계',sx,sy+15*DPR);
  if(trail.length>1){x.strokeStyle='rgba(255,209,102,.55)';x.lineWidth=1.5*DPR;x.beginPath();trail.forEach((v,i)=>{const [a,b]=P(v);i?x.lineTo(a,b):x.moveTo(a,b);});x.stroke();}
  if(target&&target.pos.length()>span*1.05){const d=target.pos.clone().normalize();x.fillStyle='#a9c4ff';x.fillText(target.name+' →',cx+d.x*(Math.min(w,h)/2-30*DPR),cy+d.z*(Math.min(w,h)/2-30*DPR));}
  const [px,py]=P(ship);x.fillStyle='#7ef3ff';x.beginPath();x.arc(px,py,3*DPR,0,6.283);x.fill();x.strokeStyle='rgba(126,243,255,.5)';x.beginPath();x.arc(px,py,7*DPR,0,6.283);x.stroke();
  x.fillStyle='rgba(160,180,220,.6)';x.textAlign='right';x.fillText('지름 '+Math.round(span*2)+'광년',w-10*DPR,h-9*DPR);}

// ── 흐름 ──
function say(h,p){$('mh').textContent=h;$('mp').textContent=p||'';}
function btn(id,on,txt){const b=$(id);b.hidden=!on;if(txt)b.textContent=txt;}
function setPhase(p){phase=p;['go','fly','warp','next'].forEach(i=>btn(i,false));
  if(p==='home'){target=null;ship.set(0,0,0);time=0;legTime=0;vel=0;warp=false;trail=[];yaw=0;pitch=0;$('sDest').textContent='-';
    lookAt=VEGA.pos.clone().normalize();
    say('태양계에서 본 베가와 리겔은 거의 똑같이 밝아요.','아래 두 망원경 창을 비교해 보세요. 베가는 여름, 리겔은 겨울 밤하늘의 별이에요. 우주선은 1초에 1광년(빛보다 빠른 상상 속 속도)으로 날아요.');btn('go',true,'🚀 베가로 출발');}
  if(p==='toVega'){target=VEGA;legTime=0;$('sDest').textContent='베가';say('베가를 향해!','버튼이나 스페이스·→ 키를 누르고 있으면 날아가요. 가는 동안 망원경 창의 두 별을 살펴보세요.');btn('fly',true);}
  if(p==='vegaArr'){say('베가 도착! 약 '+Math.round(legTime)+'초 걸렸어요.','이번엔 리겔이에요. 태양계에서 베가랑 비슷하게 보였으니, 비슷하게 걸리겠죠?');btn('next',true,'🌍 태양계로 돌아가서 리겔로 출발');}
  if(p==='toRigel'){target=RIGEL;ship.set(0,0,0);trail=[];legTime=0;yaw=0;pitch=0;$('sDest').textContent='리겔';say('리겔을 향해!','베가처럼 25초쯤 걸릴까요?');btn('fly',true);}
  if(p==='rigelArr'){warp=false;say('드디어 리겔 도착!','태양계에서는 베가와 비슷하게 보였는데… 무엇이 이상한가요? 망원경 창도 다시 비교해 보세요.');btn('next',true,'📝 항해 일지 쓰기');}}
function arrive(){holding=false;$('fly').classList.remove('on');setPhase(phase==='toVega'?'vegaArr':'rigelArr');}

let last=0,warpAmt=0;
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
  const flying=(phase==='toVega'||phase==='toRigel');
  const want=flying?(warp?WARP:holding?SPEED:0):0;vel+=(want-vel)*Math.min(1,dt*(warp?1.6:6));if(vel<.002&&want===0)vel=0;
  if(flying&&vel>0){const d=target.pos.distanceTo(ship),step=Math.min(vel*dt,Math.max(0,d-ARRIVE));ship.addScaledVector(target.pos.clone().sub(ship).normalize(),step);
    time+=dt;legTime+=dt;if(!trail.length||trail[trail.length-1].distanceTo(ship)>Math.max(.5,ship.length()/80))trail.push(ship.clone());
    if(phase==='toRigel'&&legTime>20&&$('warp').hidden&&!warp){btn('warp',true);say('리겔이 아직도 조그맣다…','이 속도로는 남은 거리만큼 초가 걸려요. 워프를 켜 볼까요?');}
    if(d-step<=ARRIVE+1e-6)arrive();}
  warpAmt+=((warp&&vel>2?1:0)-warpAmt)*Math.min(1,dt*2.5);
  cam.fov=62+warpAmt*16;cam.updateProjectionMatrix();aim();renderer.render(scene,cam);
  c2.clearRect(0,0,W,H);c2.globalCompositeOperation='lighter';
  const list=STARS.map(s=>({s,m:magAt(s,ship)})).sort((a,b)=>b.m-a.m);
  for(const {s,m} of list){const p=project(s.pos);if(!p)continue;if(p.x<-400||p.x>W+400||p.y<-400||p.y>H+400)continue;drawStar(c2,s,p.x,p.y,m,1);}
  c2.globalCompositeOperation='source-over';drawWarp(dt,warpAmt);
  // 아주 밝은 별 바로 곁: 눈부심
  const mt=target?magAt(target,ship):99;const fl=$('flash');const glare=Math.max(0,Math.min(.75,(-mt-8)/10));fl.style.opacity=glare;
  fl.style.background=`radial-gradient(circle at 50% 50%,rgba(${target===RIGEL?'200,220,255':'235,240,255'},.9),rgba(160,190,255,.25) 45%,rgba(0,0,0,0) 75%)`;
  if(phase==='home'){reticle(VEGA,'베가','#cfe2ff');reticle(RIGEL,'리겔','#a9c4ff');}else if(target)reticle(target,target.name,'#7ef3ff');
  scope('scV',VEGA);scope('scR',RIGEL);drawMap();
  $('sDist').textContent=ship.length()<10?ship.length().toFixed(1):Math.round(ship.length());
  $('sLeft').textContent=target?(Math.max(0,target.pos.distanceTo(ship)-ARRIVE)<0.05?'도착':Math.round(target.pos.distanceTo(ship))+' 광년'):'-';
  $('sSpd').textContent=vel<.01?'정지':(vel>=2?'워프 '+Math.round(vel)+' 광년/초':vel.toFixed(1)+' 광년/초');
  $('sTime').textContent=Math.floor(time);
  requestAnimationFrame(frame);}

// ── 조작 ──
$('go').onclick=()=>{if(phase==='home')setPhase('toVega');};
$('next').onclick=()=>{if(phase==='vegaArr')setPhase('toRigel');else if(phase==='rigelArr')openLog();};
$('warp').onclick=()=>{if(phase!=='toRigel'||$('warp').hidden)return;warp=!warp;$('warp').textContent=warp?'⏸ 워프 끄기':'⚡ 워프 40배';if(warp)say('⚡ 워프 중!','1초에 40광년씩 날아가요. 망원경 창의 리겔을 지켜보세요.');};
const fly=$('fly');const on=e=>{e&&e.preventDefault();holding=true;fly.classList.add('on');},off=()=>{holding=false;fly.classList.remove('on');};
fly.addEventListener('pointerdown',on);addEventListener('pointerup',off);addEventListener('pointercancel',off);fly.addEventListener('pointerleave',off);addEventListener('blur',off);
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;
  if((e.code==='Space'||e.code==='ArrowRight')&&!fly.hidden){e.preventDefault();on();}
  if(e.code==='Enter'){const b=['go','next'].map($).find(b=>!b.hidden);if(b){e.preventDefault();b.click();}}
  if(e.code==='KeyW')$('warp').click();});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowRight')off();});

// ── 항해 일지 → 질문나무 ──
function openLog(){phase='log';$('q').classList.add('show');$('cmpV').style.width=(25/860*100).toFixed(1)+'%';$('cmpR').style.width='100%';
  try{const s=JSON.parse(localStorage.getItem('star-trip')||'{}');if(s.odd)$('odd').value=s.odd;if(s.ques)$('ques').value=s.ques;}catch(e){}$('odd').focus();}
function save(){try{localStorage.setItem('star-trip',JSON.stringify({odd:$('odd').value,ques:$('ques').value}));}catch(e){}}
$('odd').oninput=save;$('ques').oninput=save;
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{const t=$('ques');if(!t.value.trim())t.value=b.dataset.s;t.focus();t.setSelectionRange(t.value.length,t.value.length);save();});
$('again').onclick=()=>{$('q').classList.remove('show');setPhase('home');};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400);}
$('send').onclick=async()=>{const q=$('ques').value.trim();if(!q){toast('② 질문을 먼저 써 주세요.');$('ques').focus();return;}
  const text=q+($('odd').value.trim()?'\n(이상했던 점: '+$('odd').value.trim()+')':'');
  try{await navigator.clipboard.writeText(text);toast('질문을 복사했어요. 질문나무에 붙여 넣으세요!');}catch(e){$('ques').select();try{document.execCommand('copy');}catch(_){}toast('복사했어요(안 되면 직접 복사해 주세요).');}
  window.open('https://scienceisjo.github.io/questionuri/','_blank','noopener');};

fit();setPhase('home');requestAnimationFrame(frame);
})();
</script>
